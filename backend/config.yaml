# backend/config.yaml
scan:
  interval_minutes: 60
  max_open_positions: 30        # sanity ceiling only — quality gates decide what opens
  regime_filter: true           # BTC below its 4h EMA-50 = bear regime (spot needs an exceptional score)
  # Candle/price sources, tried in order. A coin is routed to the first exchange
  # that lists it as a LIVE spot market, so coins not on Binance are still covered
  # and delisted/frozen markets (e.g. spot LIT/USDT) are skipped.
  exchanges: [binance, kucoin, kraken, gate]
  candle_timeframe: "15m"        # entry / signal timeframe
  candle_limit: 200
  htf_timeframe: "4h"            # higher timeframe for trend confluence filter
  htf_candle_limit: 100

scoring:
  spot_enabled: true             # 2026-07-29: re-enabled on a fixed +10%/-10% TP/SL (no ATR
                                 # scaling/decay/scale-out) at the user's request, without new
                                 # backtest evidence — prior sweeps found every config net-negative
                                 # after costs (see git log 57e2470). Watch live results closely.
  # 2026-07-29: lowered from 55/80/85 for a data-collection phase — the goal right
  # now is entry VOLUME (fill entry_log.md fast enough to read a real win rate),
  # not signal quality. Raise these back once there's enough data to judge.
  pre_filter_threshold: 40       # min technical score before fetching news + calling Gemini
  signal_threshold: 60           # min total score to fire
  max_price_divergence_pct: 8    # reject if exchange price is >8% off CMC's price (stale/wrong coin)
  pumped_skip_pct: 30            # skip a candidate already up this % over 7 days (RIF/DASH pattern)
  news_veto_threshold: 35        # skip a candidate if grounded news sentiment is below this
  bypass_regime: false           # 2026-08-01: spot now HARD-blocks entries below BTC's 4h EMA-50,
                                 # same gate whale already uses (bypass_regime: false there too).
                                 # Replaces the old "just needs a higher score" bar
                                 # (bear_signal_threshold) — live data showed bear-regime spot
                                 # entries averaged -1.46%/38% win vs bull's +2.34%/55%, and the
                                 # composite score doesn't predict outcome (higher-score buckets
                                 # underperformed lower ones), so raising the bar further wasn't
                                 # going to fix it. See cryptobot-spot-strategy-decision memory.
  technical_weight: 0.65
  news_weight: 0.35
  min_volume_24h: 25000          # CMC server-side filter: ~2785 coins (lower = more, thinner coins)
  downtrend_penalty: 0.5         # multiply technical score if 4h is NOT in an uptrend
  indicators:
    macd_weight: 30              # momentum (gated by volume confirmation)
    rsi_weight: 20               # uptrend-aware RSI
    ema_weight: 15               # price above EMA-50 on entry timeframe
    volume_weight: 15            # volume spike confirmation
    divergence_weight: 20        # bullish MACD/price divergence

# Volatility-scaled exits: stop & trail are sized from each coin's OWN ATR at entry
# (clamped), instead of one-size-fits-all %. Once a trade peaks past trail_arm_pct,
# the decaying-ROI cap lifts and a trailing high-water exit lets the runner run —
# chandelier-style exits beat fixed ones by 26-48% profit factor in backtests.
exits:
  atr_period: 14
  # Whale runner exit shape (experiment): "roi" (current) or "ema_ride".
  # Backtest-only until a sweep proves ema_ride beats roi out-of-sample.
  whale_exit_mode: roi
  ema_ride_length: 9
  # Momentum-death exit: a whale that never touched +X% within H hours is a dead
  # thrust — cut at market instead of bleeding to the 12h timeout (GIGGLE -2.75%).
  # 2026-07-05 SWEEP (60 liquid coins, 30d, 9d holdout): EVERY stagnation variant
  # beat baseline in-sample AND OOS (4h<+2%: +0.49% vs -0.10% train, -1.47% vs
  # -2.01% OOS); ema_cut lost OOS — rejected. Peak-based on purpose: NFP dipped
  # -4.8% before its +29% run but had touched +2.9% in 7min (a current-price rule
  # would have cut it); +2% spares NFP with margin, +3% would have cut it.
  whale_dead_exit_mode: stagnation
  stagnation_hours: 4
  stagnation_min_peak_pct: 2.0
  # Spot's own stagnation cut — separate knobs from whale's above, sized for
  # spot's much slower development (live sample: 3 of 5 real winners hadn't
  # touched +1% by hour 4). 2026-08-01 `--sweep spot-dead-exit` (20 coins, 21d,
  # 5d holdout): ALL 12 tested configs beat baseline OOS; 8h<+1.5% was the best
  # (net -1.25%/trade OOS vs baseline -2.53%) without degrading win rate like
  # the tighter windows did. Note: still net-negative — this cuts the bleeding,
  # it does not give spot a real edge. Thin OOS sample (15tr) — watch live.
  standard_dead_exit_mode: stagnation
  standard_stagnation_hours: 8
  standard_stagnation_min_peak_pct: 1.5
  atr_stop_multiplier: 2.5      # stop distance = 2.5 x ATR% (sweep: 2.5 beat 1.5 in every
                                # spot row; whales were indifferent across 1.5-2.5)
  stop_pct_min: 4.0
  stop_pct_max: 10.0
  atr_trail_multiplier: 1.5     # trailing give-back = 1.5 x ATR%
  trail_pct_min: 2.0
  trail_pct_max: 6.0
  trail_arm_pct: 4.0            # arm the trail once the trade has peaked past this — inert while
                                # both strategies use fixed TP/SL below (no trail_pct set at entry)
  # SWEEP VERDICT (liquid universe): scale-out beat closing in full by +0.5-1.2%/trade
  # in every real-sample combo — bank half at the first ROI target, trail the rest.
  # 2026-07-29: off while both strategies run plain fixed TP/SL (no partial banking).
  scale_out: false
  scale_fraction: 0.5
                                # (sweep: 4.0 edged 6.0/8.0 at every volume floor)
  # Re-entry cooldowns: don't re-buy the same coin right after a close — with the
  # windowed whale detection, the spike that just stopped out is still detectable.
  loss_cooldown_hours: 4
  reentry_cooldown_hours: 2

paper_trading:
  # 2026-08-08 `--sweep spot-tpsl` (79 mid-caps, 30d, 9d holdout, simulating this
  # fixed-exit path): NO fixed TP/SL gets spot above 50% win rate — the entries
  # have no edge (every one of 24 combos ~-3.5%/trade net, train AND holdout).
  # TP 2 was the highest win rate (47%w train, 46%w holdout, vs 31%w for the old
  # 10/10) and the least-bad net. Chosen per the user's win-rate-first directive;
  # it does NOT make spot net-positive — the real lever is a higher entry bar
  # (or spot off). SL near-irrelevant (stagnation/timeout fire first); 7 edged 10.
  take_profit_pct: 2.0
  stop_loss_pct: 7.0
  max_hold_hours: 24
  notional_size: 1000.0

# How open positions are tracked. Checking the 1m candle HIGH/LOW (not just the
# last price) catches brief intra-minute spikes that would otherwise be missed —
# e.g. a coin that touches +10% for only a minute still books the win.
tracking:
  # The tracker prices positions from CoinGecko (trusted/displayed price) and checks
  # TP/SL/timeout each cycle. ONE CoinGecko call per cycle while any position is open
  # — the dominant credit consumer. Budget math (24/7, positions open):
  #   120s ≈ 720/day · 300s ≈ 290/day · 600s ≈ 145/day · 900s ≈ 96/day.
  # Sized for 2,274 credits left over 17 days to the Jul-1 reset (~100/day for the
  # feed after reserving ~35/day for the scanner): 900s reaches the reset with margin.
  # Fine for a strategy that holds for hours with ATR stops + a 2–6% trail.
  price_feed_seconds: 900
  candle_timeframe: "1m"        # timeframe whose high/low is scanned for TP/SL touches
  candle_limit: 60

# Order-book entry gate (live only — books have no history to backtest): veto an
# entry when the spread is wide (danger + slippage) or the book is ask-heavy
# (research: ask-dominant depth precedes down-moves). Fails open on read errors.
book:
  enabled: true
  max_spread_pct: 1.5
  min_bid_ask_ratio: 0.75

# Whale-ride strategy: catch the footprint of large players — an abnormal volume
# surge plus a sharp price thrust in the same window. Tracked as a separate
# strategy with its own positions, exits, and win/loss stats.
whale:
  enabled: true
  bypass_regime: false          # 2026-06-17 SWEEP (60 coins, 30d, 9d holdout): EVERY
                                # regime-OBEYING config was net-positive OOS while EVERY
                                # bypass config was net-NEGATIVE. Bypassing = whales long
                                # into BTC downtrends = the correlated overnight losses.
                                # Trades less often (bull regimes only) but profitably.
  min_coin_volume_24h: 10000000 # whales only ride coins with >=$10M daily volume (10/12
                                # combos green there; thin mid-caps lose to slippage)
  volume_multiple: 4.0          # holdout winner chase+obey+4.0 = +1.52%/trade, 75% win OOS
                                # (n=8, thin) vs 3.0's +0.40% (n=13). 4.0 = pickier spikes.
  min_taker_buy_share: 0.55     # spike window must be buyer-dominated (taker buys >= 55% of
                                # volume on Binance-routed coins; seller-led spikes = distribution)
  scan_interval_minutes: 15     # fast whale-only pass over the liquid universe (full scan is
                                # hourly; this catches spikes at their confirmation candle)
  max_funding_rate: 0.001       # veto if the coin's perp funding >= 0.1%/8h — crowded longs
                                # precede deleveraging flushes (neutral funding is ~0.01%)
  entry_mode: chase             # 2026-06-17 SWEEP holdout winner used chase+obey-regime
                                # (retest+obey had ~1 trade — untested). "chase" = buy at
                                # market on the confirmed spike. Revert to "retest" if live
                                # results don't hold (thin OOS sample).
  retest_wait_candles: 8        # the pullback limit stays working this many 15m candles
  price_thrust_pct: 3.0         # price up >= 3% over the thrust lookback
  max_thrust_pct: 18            # reject if thrust >= this % over the lookback (blow-off top: DEGO/RAD)
  thrust_lookback: 3            # number of candles for the price-thrust window
  detect_window: 7              # search the last N candles for a spike (hourly scans miss
                                # mid-hour spikes otherwise); needs >=1 candle of follow-through
  # 2026-08-08 `--sweep whale-tpsl` (96 liquid coins, 45d, 12d holdout, simulating
  # THIS fixed-exit path): TP 8 beat TP 25 on BOTH win rate and net expectancy —
  # train 49%w/+0.32%/trade vs 43%w/-0.56%; holdout (15tr, rough window, nothing
  # net-positive) 53%w/-0.79% vs 29%w/-3.03%. With a 12h hold +25% is almost never
  # touched — trades die by stagnation cut/timeout instead; a nearer target banks
  # them green. SL 10/15/25 scored identically (stagnation fires first), so 10 is
  # kept purely as the disaster cap; SL 5 was worse OOS. User accepted a lower
  # reward:risk in exchange for win rate (2026-08-08). Was 25/25 since 07-29.
  take_profit_pct: 8.0
  stop_loss_pct: 10.0
  max_hold_hours: 12
  max_open: 6                   # cap concurrent whale positions — 12 overnight longs
                                # turned one dip into six stop-outs (one beta bet)
  # Entry-quality filters — fewer but higher-conviction whale rides:
  ema_period: 20                # only ride a thrust while price is above this EMA (skip downtrend bounces)
  min_candle_volume_usd: 10000  # the spike candle must move >= this much $ (kills dead-coin noise)
  max_single_candle_pct: 15     # skip if the latest candle alone jumped >= this % (blow-off top)

# Honest reporting: flat assumed round-trip cost (fees + slippage) subtracted from
# gross P&L in the digest and /stats. Matches the backtest's average measured cost
# on the >=$10M/day whale universe.
report:
  assumed_cost_pct: 0.5

# Fear & Greed-scaled TP/SL (alternative.me Crypto Fear & Greed Index, public, no
# key, cached ~1h): both strategies' fixed TP/SL are multiplied by the factor for
# the CURRENT sentiment bucket at entry (computed once, stored on the position —
# doesn't move mid-trade). UNTESTED hypothesis (2026-07-29, user request, enabled
# without backtest validation): greed tightens (bank profit before a euphoric
# reversal), fear widens (give a choppy capitulation move room). TP and SL scale
# by the same factor so each trade's reward:risk ratio is unchanged.
fear_greed:
  enabled: true
  extreme_fear_mult: 1.3
  fear_mult: 1.15
  neutral_mult: 1.0
  greed_mult: 0.85
  extreme_greed_mult: 0.7
